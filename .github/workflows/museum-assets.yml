name: Audit Museum Artwork Images
on:
  push:
    branches: [museum-image-source-audit-2026]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python scripts/collect-museum-assets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: museum-assets
          path: museum-assets.zip
          if-no-files-found: warn
