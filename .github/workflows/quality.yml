name: Final Project Quality Checks
on:
  push:
    branches: [final-atelier-2026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pages, links, forms and JS syntax
        run: node tests/smoke.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test interactivity and responsive layouts
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/mm-http.log 2>&1 &
          sleep 2
          node tests/browser.mjs
      - name: Upload desktop and mobile previews
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: design-previews
          path: |
            preview-desktop.png
            preview-mobile.png
          if-no-files-found: error
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure.png
          if-no-files-found: ignore
