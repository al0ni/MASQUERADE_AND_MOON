name: Import final reviewed site
on:
  push:
    branches: [deploy-clean-2026-11-18]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and extract final site
        shell: bash
        run: |
          set -euo pipefail
          cat .site-upload/part-*.bin > /tmp/masquerade-final.zip
          echo "c692f9457355357f0676bc34036184018640dbb466f25d72edfaae0e4040c719  /tmp/masquerade-final.zip" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          folder = Path('/tmp/site-import')
          folder.mkdir(exist_ok=True)
          with ZipFile('/tmp/masquerade-final.zip') as archive:
              assert archive.testzip() is None
              files = archive.namelist()
              assert all(name.startswith('MASQUERADE_AND_MOON/') for name in files)
              archive.extractall(folder)
          source = folder / 'MASQUERADE_AND_MOON'
          assert (source / 'index.html').is_file()
          assert (source / 'js/script.js').is_file()
          assert len(list((source / 'images').glob('look-*.jpg'))) == 24
          assert len(list((source / 'images/museum').glob('*.webp'))) == 6
          print('Validated 9-page website, 24 costumes and 6 museum images.')
          PY
          mkdir -p /tmp/preserved-workflows
          cp -a .github/workflows/. /tmp/preserved-workflows/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site-import/MASQUERADE_AND_MOON/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/preserved-workflows/. .github/workflows/
          node --check js/script.js
          node tests/smoke.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified final website without source comments"
          git push origin HEAD:deploy-clean-2026-11-18
