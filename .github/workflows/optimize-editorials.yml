name: Optimize Editorial Photos
on:
  push:
    branches: [luxury-audit-2026]
    paths:
      - '.github/workflows/optimize-editorials.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow==11.3.0
      - name: Optimize original images and prepare visual contact sheet
        run: python scripts/optimize_photos.py
      - name: Upload contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: original-image-audit
          path: |
            site_contact_sheet.jpg
            optimizer_report.txt
      - name: Commit lightweight images to audit branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add images
          if git diff --cached --quiet; then echo "Images already optimized"; else
            git commit -m "Optimize all storefront images for mobile and fast loading"
            git push origin HEAD:luxury-audit-2026
          fi
