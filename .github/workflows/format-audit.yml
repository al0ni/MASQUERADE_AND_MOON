name: Format Final Audit
on:
  push:
    branches: [final-critical-audit-2026]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-critical-audit-2026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply consistent source formatting
        run: npx --yes prettier@3.6.2 --write '*.html' css/style.css js/script.js 'tests/*.mjs' scripts/optimize_photos.py --ignore-unknown
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add '*.html' css/style.css js/script.js tests
            git commit -m "Format final source consistently"
            git push origin HEAD:final-critical-audit-2026
          fi
